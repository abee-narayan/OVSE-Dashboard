services:
  - type: web
    name: ovse-executive-dashboard
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: false # Set your secure password in Render dashboard or specify here
      - key: VIEWER_USERNAME
        value: viewer
      - key: VIEWER_PASSWORD
        generateValue: false # Set your viewer password in Render dashboard or specify here
      - key: SESSION_SECRET
        generateValue: true
