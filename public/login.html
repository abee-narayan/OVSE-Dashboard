<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | OVSE Transaction Intelligence Portal</title>
  <!-- Tailwind CSS (Local Intranet Bundle + CDN Fallback) -->
  <script src="/assets/vendor/tailwindcss.js" onerror="this.onerror=null;this.src='https://cdn.tailwindcss.com'"></script>
  <!-- Lucide Icons (Local Intranet Bundle + CDN Fallback) -->
  <script src="/assets/vendor/lucide.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/lucide@latest'"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #0f172a;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-slate-950">

  <!-- Ambient background glow -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-80 h-80 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">

    <!-- Card -->
    <div class="login-box rounded-2xl p-8 sm:p-10">
      
      <!-- Logo & Branding -->
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-bold text-2xl shadow-lg shadow-indigo-600/30 mx-auto mb-4">
          <i data-lucide="shield-check" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">OVSE Intelligence Portal</h1>
        <p class="text-xs text-indigo-600 font-bold mt-1.5 uppercase tracking-wide">Offline Verification Seeking Entities (OVSE)</p>
        <p class="text-[11px] text-slate-500 font-medium mt-0.5">Senior Management Executive Analytics</p>
      </div>

      <!-- Error Message Banner -->
      <div id="errorAlert" class="hidden mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2.5">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-rose-600"></i>
        <span id="errorMessage">Invalid credentials. Please try again.</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        
        <div>
          <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input 
              type="text" 
              id="username" 
              name="username" 
              required 
              autocomplete="username"
              placeholder="e.g. admin" 
              class="w-full pl-10 pr-3.5 py-2.5 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 transition"
            >
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              autocomplete="current-password"
              placeholder="••••••••••••" 
              class="w-full pl-10 pr-10 py-2.5 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 transition"
            >
            <button 
              type="button" 
              onclick="togglePasswordVisibility()" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600"
            >
              <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center text-xs text-slate-600 cursor-pointer">
            <input type="checkbox" checked class="w-3.5 h-3.5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
            <span class="ml-2">Keep me signed in</span>
          </label>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full mt-4 py-3 px-4 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition shadow-md shadow-indigo-600/20 flex items-center justify-center gap-2"
        >
          <span id="btnText">Sign In to Dashboard</span>
          <i data-lucide="arrow-right" class="w-4 h-4" id="btnIcon"></i>
          <span id="btnSpinner" class="hidden animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
        </button>

      </form>

      <!-- Security Notice -->
      <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-400 flex items-center justify-center gap-1.5">
          <i data-lucide="lock" class="w-3 h-3 text-emerald-500"></i>
          <span>Authorized personnel only • 256-bit SSL encrypted</span>
        </p>
      </div>

    </div>

    <!-- Render Hosting Notice -->
    <div class="text-center mt-6 text-slate-500 text-xs">
      Hosted on Render Cloud • OVSE Transaction Monitoring
    </div>

  </div>

  <script>
    if (typeof lucide !== 'undefined') lucide.createIcons();

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwdInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      const btnSpinner = document.getElementById('btnSpinner');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.innerText = "Authenticating...";
      btnIcon.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          btnText.innerText = "Access Granted! Redirecting...";
          window.location.href = '/';
        } else {
          errorMessage.innerText = data.error || 'Authentication failed. Please verify credentials.';
          errorAlert.classList.remove('hidden');
          submitBtn.disabled = false;
          btnText.innerText = "Sign In to Dashboard";
          btnIcon.classList.remove('hidden');
          btnSpinner.classList.add('hidden');
        }
      } catch (err) {
        errorMessage.innerText = 'Unable to connect to server. Please try again.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        btnText.innerText = "Sign In to Dashboard";
        btnIcon.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
